name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      EXPO_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build Expo web bundle
        run: npm run build:web

  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      POSTGRES_DB: applymate
      POSTGRES_USER: applymate
      POSTGRES_PASSWORD: applymate_ci_password
      POSTGRES_PORT: "5432"
      EMAIL_VERIFICATION_PEPPER: "YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY="
      JWT_SECRET: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:[*]"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: applymate
          POSTGRES_USER: applymate
          POSTGRES_PASSWORD: applymate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applymate -d applymate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Test and package backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify


  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - frontend
      - backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build production backend image
        run: docker build --pull --tag applymate-backend:ci backend

      - name: Verify image runtime configuration
        run: |
          configured_user="$(
            docker image inspect applymate-backend:ci \
              --format '{{.Config.User}}'
          )"

          if [ "$configured_user" != "applymate" ]; then
            echo "Expected image user 'applymate' but found '$configured_user'."
            exit 1
          fi

          healthcheck="$(
            docker image inspect applymate-backend:ci \
              --format '{{json .Config.Healthcheck.Test}}'
          )"

          if [ "$healthcheck" = "null" ] || [ -z "$healthcheck" ]; then
            echo "Docker image does not define a health check."
            exit 1
          fi

          docker image inspect applymate-backend:ci \
            --format \
            'User={{.Config.User}} Size={{.Size}} Healthcheck={{json .Config.Healthcheck.Test}}'