# ==========================================
# ApplyMate production configuration
# Activate with:
# SPRING_PROFILES_ACTIVE=prod
# ==========================================

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database connection pool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Authentication
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
security.refresh-token.ttl=${REFRESH_TOKEN_TTL:P30D}

# Email verification
security.email-verification.pepper=${EMAIL_VERIFICATION_PEPPER}
security.email-verification.code-ttl=${EMAIL_VERIFICATION_CODE_TTL:PT10M}
security.email-verification.resend-cooldown=${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT60S}
security.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
security.email-verification.issue-window=${EMAIL_VERIFICATION_ISSUE_WINDOW:PT1H}
security.email-verification.max-issues-per-window=${EMAIL_VERIFICATION_MAX_ISSUES_PER_WINDOW:5}

# Password reset
security.password-reset.pepper=${PASSWORD_RESET_PEPPER}
security.password-reset.code-ttl=${PASSWORD_RESET_CODE_TTL:PT10M}
security.password-reset.resend-cooldown=${PASSWORD_RESET_RESEND_COOLDOWN:PT60S}
security.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}
security.password-reset.issue-window=${PASSWORD_RESET_ISSUE_WINDOW:PT1H}
security.password-reset.max-issues-per-window=${PASSWORD_RESET_MAX_ISSUES_PER_WINDOW:5}
security.password-reset.minimum-response-duration=${PASSWORD_RESET_MINIMUM_RESPONSE_DURATION:PT1S}

# CORS
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Error-response safety
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=WARN