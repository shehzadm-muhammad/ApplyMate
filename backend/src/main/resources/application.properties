spring.application.name=ApplyMateBackend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:applymate}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.issuer=applymate-api
security.jwt.access-token-ttl=PT15M
security.jwt.secret=${JWT_SECRET}
security.refresh-token.ttl=P30D

# Email verification
security.email-verification.pepper=${EMAIL_VERIFICATION_PEPPER}
security.email-verification.code-ttl=${EMAIL_VERIFICATION_CODE_TTL:PT10M}
security.email-verification.resend-cooldown=${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT60S}
security.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
security.email-verification.issue-window=${EMAIL_VERIFICATION_ISSUE_WINDOW:PT1H}
security.email-verification.max-issues-per-window=${EMAIL_VERIFICATION_MAX_ISSUES_PER_WINDOW:5}

# Transactional email
app.email.provider=${EMAIL_PROVIDER:disabled}
app.email.from=${EMAIL_FROM:}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.connect-timeout=${EMAIL_CONNECT_TIMEOUT:PT5S}
app.email.resend.read-timeout=${EMAIL_READ_TIMEOUT:PT10S}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}